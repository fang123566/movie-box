<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 电影信息系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card modern-card" style="max-width: 500px;">
            <div class="login-header">
                <div class="login-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2>创建账户</h2>
                <p class="mb-0">加入我们的电影社区</p>
            </div>

            <div class="login-body">
                <!-- 添加错误显示区域 -->
                <div id="error-message" class="alert alert-danger d-none"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名 *</label>
                        <div class="modern-search">

                            <input type="text" class="form-control" id="username" name="username" required
                                   minlength="3" placeholder="至少3个字符">
                        </div>
                        <div class="form-text ms-3">用户名至少3个字符</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">密码 *</label>
                        <div class="modern-search">

                            <input type="password" class="form-control" id="password" name="password" required
                                   minlength="6" placeholder="至少6个字符">
                        </div>
                        <div class="form-text ms-3">密码至少6个字符</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认密码 *</label>
                        <div class="modern-search">

                            <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                                   required placeholder="再次输入密码">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="nickname" class="form-label">昵称</label>
                        <div class="modern-search">

                            <input type="text" class="form-control" id="nickname" name="nickname"
                                   placeholder="可选填">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">注册身份</label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="role" id="roleUser" value="user" checked>
                                <label class="form-check-label" for="roleUser">
                                    <i class="fas fa-user me-1"></i> 普通用户
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="role" id="roleAdmin" value="admin">
                                <label class="form-check-label" for="roleAdmin">
                                    <i class="fas fa-shield-alt me-1"></i> 管理员
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3 d-none" id="adminCodeGroup">
                        <label for="admin_code" class="form-label">管理员邀请码 *</label>
                        <div class="modern-search">
                            <input type="password" class="form-control" id="admin_code" name="admin_code"
                                   placeholder="请输入管理员邀请码">
                        </div>
                        <div class="form-text ms-3 text-warning">
                            <i class="fas fa-info-circle me-1"></i>管理员账号拥有完整系统权限，请妥善保管
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="age" class="form-label">年龄</label>
                            <div class="modern-search">

                                <input type="number" class="form-control" id="age" name="age" min="1" max="120"
                                       placeholder="可选填">
                            </div>
                        </div>
                        <div class="col-md-6" id="genderGroup">
                            <label for="gender" class="form-label">性别</label>
                            <select class="form-select modern-select" id="gender" name="gender">
                                <option value="">请选择</option>
                                <option value="male">男</option>
                                <option value="female">女</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn gradient-btn w-100 mb-3" id="submitBtn">
                        <i class="fas fa-user-plus me-2"></i> 注册
                    </button>

                    <div class="text-center">
                        <p class="text-muted">已有账户？
                            <a href="{{ url_for('login_page') }}" class="text-decoration-none fw-bold"
                               style="color: #667eea;">立即登录</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
    <script>
    document.querySelectorAll('input[name="role"]').forEach(radio => {
        radio.addEventListener('change', () => {
            const isAdmin = document.getElementById('roleAdmin').checked;
            document.getElementById('adminCodeGroup').classList.toggle('d-none', !isAdmin);
            document.getElementById('genderGroup').classList.toggle('d-none', isAdmin);
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = isAdmin
                ? '<i class="fas fa-shield-alt me-2"></i> 注册管理员账号'
                : '<i class="fas fa-user-plus me-2"></i> 注册';
        });
    });
    </script>
</body>
</html>
