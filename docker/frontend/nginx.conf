# ============================================================
# 电影盒子 · Nginx 站点配置（打进 frontend 镜像的 /etc/nginx/conf.d/default.conf）
#
# 三条核心规则：
#   1. /api/  →  反代到 backend:8000（compose 服务名，容器网络内 DNS 解析）
#   2. /assets/ → 指纹静态资产长缓存（vite 产物带内容 hash，不会过期失效）
#   3. 其余     → try_files 回退 index.html（SPA history 路由刷新不 404）
# ============================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------- 压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 后端 API 反代 ----------
    # /api/v1/img 是海报代理端点，容器里出网抓 TMDB 可能慢，读超时放宽松
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ---------- 指纹静态资产：长缓存 ----------
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- SPA 入口 HTML：不缓存 ----------
    # index.html 引用带 hash 的 JS；若被强缓存，部署后浏览器会复用旧入口、
    # 引用已被删除的旧 chunk 而白屏 / 看不到更新。设为 no-cache 后每次刷新都
    # 重新验证，确保拿到最新 hash 的入口（/assets/ 仍走上面的长缓存，不受影响）。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
